<!DOCTYPE html>

<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>FinPulse - Transações</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');

        body {
            font-family: 'Geist', sans-serif;
            background-color: #000000;
            color: #e2e2e2;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .luminous-gradient {
            background: linear-gradient(135deg, #2d5bff 0%, #6e06d0 100%);
        }

        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        .active-tab-indicator {
            box-shadow: 0 0 15px rgba(45, 91, 255, 0.3);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#450086",
                        "inverse-on-surface": "#303030",
                        "tertiary-fixed": "#63f7ff",
                        "secondary-fixed-dim": "#d8b9ff",
                        "tertiary": "#00dce5",
                        "on-primary-fixed-variant": "#0035bd",
                        "on-tertiary": "#003739",
                        "surface-container-highest": "#353535",
                        "primary-fixed-dim": "#b8c3ff",
                        "on-primary-fixed": "#001355",
                        "surface-dim": "#131313",
                        "primary": "#b8c3ff",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed": "#290055",
                        "on-secondary-fixed-variant": "#6200bc",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#eddcff",
                        "inverse-surface": "#e2e2e2",
                        "primary-fixed": "#dde1ff",
                        "on-tertiary-fixed": "#002021",
                        "surface-container-high": "#2a2a2a",
                        "on-error": "#690005",
                        "surface-tint": "#b8c3ff",
                        "tertiary-fixed-dim": "#00dce5",
                        "inverse-primary": "#104af0",
                        "surface": "#131313",
                        "error-container": "#93000a",
                        "tertiary-container": "#00797e",
                        "on-background": "#e2e2e2",
                        "secondary-container": "#6e06d0",
                        "primary-container": "#2d5bff",
                        "on-surface-variant": "#c4c5d9",
                        "on-primary-container": "#efefff",
                        "on-primary": "#002387",
                        "background": "#131313",
                        "surface-container-low": "#1b1b1b",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary": "#d8b9ff",
                        "outline-variant": "#434656",
                        "on-secondary-container": "#d5b5ff",
                        "on-tertiary-fixed-variant": "#004f53",
                        "surface-variant": "#353535",
                        "surface-container": "#1f1f1f",
                        "on-tertiary-container": "#bafbff",
                        "error": "#ffb4ab",
                        "surface-bright": "#393939",
                        "outline": "#8e90a2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "12px",
                        "stack-lg": "40px",
                        "container-margin": "20px",
                        "stack-md": "24px",
                        "gutter": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Geist"],
                        "body-lg": ["Geist"],
                        "label-sm": ["Geist"],
                        "display-lg": ["Geist"],
                        "label-md": ["Geist"],
                        "headline-md": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-lg": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-black min-h-screen pb-32">
    <!-- TopAppBar -->
    <header
        class="flex justify-between items-center w-full px-container-margin py-base sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-sm">
        <div class="flex items-center gap-3">
            <img alt="FinPulse Logo" class="w-10 h-10 object-contain"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUH7alp-5uAwebtSGE-qLQjO0nDINeTA_IUmpmBfGCrNgWS_-FEkk-uau2P2Z-ESdH4mlwVRcDjfdnjmIT1ZXL0ku7HOe6JeoQtgXAlDCcejBVowMuKXxHbaPJHq2iy2hz99Wt-tnReAQm8zC_z3z0C5P-CCg2uVWRNjzps3izg8UWjp7krau1L11rpbwlC6TF1AnX_eD-j2N0OMuiXOeu5VgUYXqzO28SO3h1PiS39Ic5qXobptzt-LERoAyn80WE-dAL-AXBfeo" />
            <h1 class="font-display-lg text-headline-md-mobile text-primary">FinPulse</h1>
        </div>
        <div class="relative active:scale-95 transition-transform duration-200 flex items-center gap-4">
            <span class="material-symbols-outlined text-white/90 cursor-pointer" id="btn-logout" title="Sair" onclick="window.db.auth.signOut()">logout</span>
            <div
                class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant active:scale-95 transition-transform duration-200">
            <img alt="User Profile" class="w-full h-full object-cover"
                data-alt="A professional high-fidelity 3D avatar profile picture of a young tech-savvy executive. The character has a sharp, modern appearance with stylized features, set against a vibrant purple and blue gradient background. The lighting is dramatic and cinematic, reflecting a high-end SaaS platform's premium aesthetic with deep contrasts and soft glows."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7eD7zkYbH8QwgchLE5OOTnuC2UE735dG9aJoBjF_uXKJ2ICljgC26GFdfJQbKIi8kI7X0yJmLeMjhPm3dt_0oNypu6gtZCV_jupHzV9Qm0G-0h1xj-v7bjcufx8uAB9qsb4tIl46pqN1InWW3-czbSCdOsSfwX2rA-x6urV4eJKsnXCmSEk-0jowrkhVnI6UFLIOZUaJen0iY4fVOx-r7fSTyA4HSgSASpKjVHIBjuRW2TLDcUukSF4gUW-IvLBCU_Ttc1-u68m8" />
        </div>
    </header>
    <main class="px-container-margin mt-stack-md">
        <!-- Monthly Summary Card -->
        <section class="mb-stack-md">
            <div class="glass-card rounded-xl p-stack-md flex flex-col gap-4 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 luminous-gradient blur-[80px] opacity-20 -mr-10 -mt-10">
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">
                            Resumo do Mês</p>
                        <p id="saldo-disponivel" class="font-headline-md text-headline-md-mobile text-on-surface">R$ 0,00</p>
                    </div>
                    <div class="flex items-center gap-1 text-tertiary">
                        <span class="material-symbols-outlined text-sm">trending_up</span>
                        <span class="font-label-sm text-label-sm">12%</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-label-sm text-label-sm">
                        <span id="resumo-gastos" class="text-on-surface-variant">Gastos: R$ 0,00</span>
                        <span id="resumo-limite" class="text-primary">Limite: R$ 0,00</span>
                    </div>
                    <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                        <div class="h-full luminous-gradient w-[0%] rounded-full shadow-[0_0_8px_rgba(45,91,255,0.5)]">
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Search and Filters -->
        <section class="mb-stack-md space-y-stack-sm">
            <div class="relative">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                <input
                    class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/50 transition-all font-body-md text-body-md"
                    placeholder="Buscar transações..." type="text" />
            </div>
            <div class="flex gap-2 overflow-x-auto scroll-hide pb-2">
                <button
                    class="flex-shrink-0 px-5 py-2 rounded-full luminous-gradient text-on-primary font-label-md text-label-md transition-all active:scale-95">Todas</button>
                <button
                    class="flex-shrink-0 px-5 py-2 rounded-full glass-card text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high/50 transition-all active:scale-95">Alimentação</button>
                <button
                    class="flex-shrink-0 px-5 py-2 rounded-full glass-card text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high/50 transition-all active:scale-95">Lazer</button>
                <button
                    class="flex-shrink-0 px-5 py-2 rounded-full glass-card text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high/50 transition-all active:scale-95">Serviços</button>
                <button
                    class="flex-shrink-0 px-5 py-2 rounded-full glass-card text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high/50 transition-all active:scale-95">Educação</button>
            </div>
        </section>
        <!-- Transactions List -->
        <section class="space-y-stack-md">
            <!-- Group: Hoje -->
            <div class="space-y-stack-sm">
                <h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest px-1">Hoje</h3>
                    <!-- As transações serão renderizadas aqui pelo app.js -->
                </div>
            </div>
        </section>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-6 bg-surface/90 dark:bg-surface/90 backdrop-blur-2xl border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] rounded-t-xl">
        <!-- Início -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all active:scale-90 duration-300"
            href="#">
            <span class="material-symbols-outlined">home</span>
            <span class="font-label-sm text-label-sm mt-1">Início</span>
        </a>
        <!-- Transações (Active) -->
        <a class="flex flex-col items-center justify-center bg-primary-container/20 text-primary dark:text-primary-fixed-dim rounded-xl px-4 py-1.5 active-tab-indicator transition-all active:scale-90 duration-300"
            href="#">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">swap_horiz</span>
            <span class="font-label-sm text-label-sm font-bold mt-1">Transações</span>
        </a>
        <!-- Cartões -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all active:scale-90 duration-300"
            href="#">
            <span class="material-symbols-outlined">credit_card</span>
            <span class="font-label-sm text-label-sm mt-1">Cartões</span>
        </a>
        <!-- Investimentos -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all active:scale-90 duration-300"
            href="#">
            <span class="material-symbols-outlined">trending_up</span>
            <span class="font-label-sm text-label-sm mt-1">Investimentos</span>
        </a>
    </nav>
    <script>
        // Simple haptic-like interaction for cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Filter chip selection logic
        const filterChips = document.querySelectorAll('button.flex-shrink-0');
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('luminous-gradient', 'text-on-primary');
                    c.classList.add('glass-card', 'text-on-surface-variant');
                });
                chip.classList.add('luminous-gradient', 'text-on-primary');
                chip.classList.remove('glass-card', 'text-on-surface-variant');
            });
        });
    </script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
