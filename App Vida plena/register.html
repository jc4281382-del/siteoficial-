<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vida Plena - Registro</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#000741",
                        "secondary": "#b40081",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#454652",
                        "surface-variant": "#e1e2e5",
                        "on-secondary-fixed-variant": "#8a0061"
                    },
                    fontFamily: {
                        "label-bold": ["Be Vietnam Pro"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Be Vietnam Pro"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f8f9fc;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark body {
            background-color: #0f172a;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(0, 20, 120, 0.05);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-input {
            background-color: #F1F3F9;
            border: 2px solid transparent;
            transition: all 0.2s ease-in-out;
            color: #191c1e;
        }
        .dark .form-input {
            background-color: #334155;
            color: #f8fafc;
        }
        .form-input:focus {
            background-color: #ffffff;
            border-color: #DC28A0;
            box-shadow: 0 0 0 4px rgba(220, 40, 160, 0.1);
            outline: none;
        }
        .dark .form-input:focus {
            background-color: #1e293b;
        }
        .radiant-bg {
            background: radial-gradient(circle at 10% 20%, rgba(180, 220, 240, 0.4) 0%, rgba(255, 255, 255, 0) 60%),
                radial-gradient(circle at 90% 80%, rgba(220, 40, 160, 0.05) 0%, rgba(255, 255, 255, 0) 50%);
        }
        .dark .radiant-bg {
            background: radial-gradient(circle at 10% 20%, rgba(180, 220, 240, 0.1) 0%, rgba(15, 23, 42, 0) 60%),
                radial-gradient(circle at 90% 80%, rgba(220, 40, 160, 0.1) 0%, rgba(15, 23, 42, 0) 50%);
            background-color: #0f172a;
        }
        .btn-hover-effect { transition: transform 0.2s, box-shadow 0.2s; }
        .btn-hover-effect:active { transform: scale(0.96); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
    </style>
    <!-- PWA integration -->
    <link rel="manifest" href="manifest.json" />
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Service Worker ativo!', reg))
                    .catch(err => console.error('Erro no PWA Service Worker:', err));
            });
        }
    </script>
</head>
<body class="radiant-bg min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" class="p-2 rounded-full glass-card hover:scale-105 transition-transform text-primary dark:text-white flex items-center justify-center">
            <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
        </button>
    </div>

    <!-- Auth Container -->
    <main class="w-full max-w-[480px] z-10">
        <div class="glass-card rounded-2xl p-6 md:p-10 flex flex-col items-center">
            <div class="mb-8 text-center">
                <img alt="Vida Plena Logo" class="w-24 h-24 mb-4 mx-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPLQXZnp3LBg6qGhtMOLy1nTv-GPcLt0vtLBw5pM_OHRM6IdefNJC96Po9Zz94SdUBwYu9NYI3mQ_FxppgJLeHDTIi8GXrs4M8S7T1JBeLemrQtZlbD17XXBVj0jSzjzaLVBlEibreuFpL2OM1yxgjWOFx9xv_Htt60yPX9tN_3hG4T8xyCXpXsh1zLRhgsDwK2fHb8peYiN7G4RqkmPCrOPPJk0r4hyLXfu2HbvYPO_myis7Ox7mM46bYjY04JkQChgeuLVKeQO0" />
                <h1 class="font-headline-lg text-3xl font-bold text-primary dark:text-white tracking-tight">Criar Conta</h1>
                <p class="font-body-md text-on-surface-variant dark:text-gray-300 mt-1">Junte-se à Vida Plena</p>
            </div>
            
            <div id="auth-alert" class="w-full hidden p-3 mb-4 text-sm rounded-lg" role="alert"></div>

            <section class="w-full fade-in" id="register-section">
                <form id="form-register" class="space-y-5">
                    <div class="space-y-2">
                        <label class="font-label-bold text-sm font-bold text-on-surface dark:text-gray-200" for="name-reg">Nome Completo</label>
                        <input class="w-full h-12 px-4 rounded-xl form-input text-base" id="name-reg" placeholder="Como deseja ser chamado" type="text" required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-label-bold text-sm font-bold text-on-surface dark:text-gray-200" for="email-reg">E-mail</label>
                        <input class="w-full h-12 px-4 rounded-xl form-input text-base" id="email-reg" placeholder="seu@email.com" type="email" required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-label-bold text-sm font-bold text-on-surface dark:text-gray-200" for="password-reg">Senha</label>
                        <input class="w-full h-12 px-4 rounded-xl form-input text-base" id="password-reg" placeholder="••••••••" type="password" required />
                        <p class="text-[11px] text-gray-500 dark:text-gray-400 leading-tight mt-1 px-1">
                            Pelo menos 6 caracteres.
                        </p>
                    </div>
                    <div class="space-y-2">
                        <label class="font-label-bold text-sm font-bold text-on-surface dark:text-gray-200" for="church-select">Qual igreja você pertence?</label>
                        <div class="relative">
                            <select class="w-full h-12 px-4 pr-10 rounded-xl form-input text-base appearance-none" id="church-select" required>
                                <option disabled selected value="">Selecione sua unidade</option>
                                <option value="Nilopolis">Igreja Batista Vida Plena - Nilópolis</option>
                                <option value="Chatuba">Igreja Batista Vida Plena - Chatuba</option>
                                <option value="Edsson Passos">Igreja Batista Vida Plena - Edsson Passos</option>
                                <option value="Cocais">Igreja Batista Vida Plena - Cocáis</option>
                                <option value="Novo Templo">Igreja Batista Vida Plena - Novo Templo</option>
                                <option value="Bela Vista">Igreja Batista Vida Plena - Bela Vista</option>
                                <option value="Formosa">Igreja Batista Vida Plena - Formosa</option>
                                <option value="Parque Piaui">Igreja Batista Vida Plena - Parque Piauí</option>
                                <option value="Promorar">Igreja Batista Vida Plena - Promorar</option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500 dark:text-gray-400">
                                <span class="material-symbols-outlined">expand_more</span>
                            </div>
                        </div>
                    </div>
                    <button id="btn-register" class="w-full h-12 bg-secondary text-white font-bold text-sm rounded-full btn-hover-effect shadow-md hover:bg-on-secondary-fixed-variant mt-4 flex justify-center items-center gap-2" type="submit">
                        Criar Conta
                    </button>
                </form>
                <div class="mt-8 pt-6 border-t border-surface-variant dark:border-slate-700 text-center">
                    <p class="font-body-md text-sm text-on-surface-variant dark:text-gray-400">
                        Já possui uma conta?
                        <a href="login.html" class="text-secondary dark:text-pink-400 font-bold hover:underline ml-1">Fazer Login</a>
                    </p>
                </div>
            </section>
        </div>
    </main>
    
    <!-- Decorative -->
    <div class="fixed top-[-10%] right-[-5%] w-[40%] h-[40%] bg-[#B4DCF0]/20 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="fixed bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-[#DC28A0]/5 blur-[100px] rounded-full pointer-events-none"></div>
    
    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://tyzfporikxcafzlelpyg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5emZwb3Jpa3hjYWZ6bGVscHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDQzOTQsImV4cCI6MjA5NTc4MDM5NH0.374W6KI_tKckUa83L3vE4OoS-V9-D4iSb6LoZXBE2WI';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Verifica se ja esta logado
        sb.auth.getSession().then(({data}) => {
            if (data.session) window.location.href = 'app.html';
        });

        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById('auth-alert');
            alertEl.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
            if (type === 'error') {
                alertEl.classList.add('bg-red-100', 'text-red-800', 'dark:bg-red-900', 'dark:text-red-200');
            } else {
                alertEl.classList.add('bg-green-100', 'text-green-800', 'dark:bg-green-900', 'dark:text-green-200');
            }
            alertEl.textContent = message;
            setTimeout(() => { alertEl.classList.add('hidden'); }, 5000);
        }

        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processando...';
            
            const name = document.getElementById('name-reg').value;
            const email = document.getElementById('email-reg').value;
            const password = document.getElementById('password-reg').value;
            const church = document.getElementById('church-select').value;
            
            const { data, error } = await sb.auth.signUp({
                email, password,
                options: { data: { full_name: name, church_unit: church } }
            });
            
            if (error) {
                btn.disabled = false;
                btn.innerHTML = 'Criar Conta';
                showAlert(error.message, 'error');
                return;
            }

            // Inserir na tabela solicitada: usuarios_app
            const { error: insertError } = await sb.from('usuarios_app').insert([
                { id: data?.user?.id, nome: name }
            ]);
            
            btn.disabled = false;
            btn.innerHTML = 'Criar Conta';
            
            if (insertError) {
                showAlert("Conta criada, mas erro ao salvar dados: " + insertError.message, 'error');
            } else {
                showAlert('Conta criada com sucesso! Redirecionando para o login...', 'success');
                await sb.auth.signOut();
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
        
        // Input styles
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-secondary', 'dark:text-pink-400');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-secondary', 'dark:text-pink-400');
            });
        });

        // Dark/Light Mode
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = 'light_mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = 'dark_mode';
                localStorage.setItem('theme', 'light');
            }
        }
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme('dark');
        } else {
            setTheme('light');
        }
        
        themeToggleBtn.addEventListener('click', () => {
            setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
    </script>
</body>
</html>
