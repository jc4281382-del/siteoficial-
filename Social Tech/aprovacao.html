                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMpKVAcs6k5BirMtn0lslhJxiCilCqSLDFKT7CJbBpHg5ypDOxwJiFtAg6K-O4LI29n42JxvYaQe5rgreWMeydSGIt3lLGY1YKuZvl3jbX5-E9RTFeWySRWYPoY2YQ3ZDwJid8yMgnf556TTQM5ak1zOPmRdvTG95UUO07QZiWGr9uVk5m7kQ7gIdxpyBP9czUJPcLk4JfUWsRdfRkJAycaDTbVsBh8kjs1lzqGm7U-SpY5YHICBQV99dwH3W2ekq5yX87YIU7lYw" />

    <!-- Main Content Area -->

                </div>

        <!-- Page Content -->
        <div class="pt-24 px-margin-mobile md:px-margin-desktop max-w-[1200px] mx-auto">

                            Aprovação</h3>

                                id="pending-count" class="text-primary font-bold">0 posts</span> aguardando sua revisão para esta semana.

            </section>

        class="fixed bottom-0 w-full md:hidden z-50 bg-surface-container border-t border-outline-variant shadow-lg flex justify-around items-center h-16 px-4 pb-safe">

        </button>
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 active:bg-surface-bright scale-95 transition-transform" onclick="window.location.href='calendar.html'">

            <span class="font-label-sm text-label-sm">Agenda</span>
        </button>
        <!-- Active Tab -->

            class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 active:bg-surface-bright scale-95 transition-transform" onclick="window.location.href='aprovacao.html'">

        </button>
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 active:bg-surface-bright scale-95 transition-transform" onclick="window.location.href='config.html'">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-sm text-label-sm">Config</span>
        </button>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const approvalsGrid = document.getElementById('approvals-grid');
            const pendingCountEl = document.getElementById('pending-count');
            const btnApproveAll = document.getElementById('btn-approve-all');
            
            let pendingPosts = [];

            // Inicializar Supabase
            await initializeDefaultData();

            // Buscar posts pendentes do Supabase
            async function fetchPendingPosts() {
                try {
                    const { data, error } = await supabase
                        .from('posts')
                        .select('*')
                        .eq('client_id', DEFAULT_CLIENT_ID)
                        .in('status', ['Aguardando', 'Pendente'])
                        .order('scheduled_at', { ascending: true });

                    if (error) throw error;
                    pendingPosts = data || [];
                    
                    // Atualizar contador
                    pendingCountEl.textContent = `${pendingPosts.length} ${pendingPosts.length === 1 ? 'post' : 'posts'}`;
                    
                    renderApprovals();
                } catch(err) {
                    console.error('Erro ao buscar posts pendentes:', err);
                }
            }

            // Renderizar cards de aprovação
            function renderApprovals() {
                approvalsGrid.innerHTML = '';
                
                if (pendingPosts.length === 0) {
                    approvalsGrid.innerHTML = `
                        <div class="glass-card p-lg rounded-xl text-center text-on-surface-variant text-body-md col-span-1 lg:col-span-2 w-full">
                            Tudo limpo! Não há nenhum post aguardando aprovação no momento.
                        </div>`;
                    btnApproveAll.style.display = 'none';
                    return;
                }
                
                btnApproveAll.style.display = 'block';

                pendingPosts.forEach(post => {
                    const card = document.createElement('article');
                    card.className = 'glass-card rounded-xl overflow-hidden flex flex-col group w-full';
                    
                    const dateObj = new Date(post.scheduled_at);
                    const formattedDate = dateObj.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }) + ', ' + dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    
                    const isVideo = post.type === 'Vídeo';

                    card.innerHTML = `
                        <div class="relative aspect-video overflow-hidden cursor-pointer">
                            ${post.media_url 
                                ? `<img alt="Post Preview" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${post.media_url}" />`
                                : `<div class="w-full h-full bg-surface-container-high flex items-center justify-center"><span class="material-symbols-outlined text-outline text-5xl">${isVideo ? 'movie' : 'image'}</span></div>`
                            }
                            <div class="absolute top-4 right-4 bg-surface/80 backdrop-blur-md px-sm py-xs rounded-lg flex items-center gap-xs border border-outline-variant">
                                <span class="material-symbols-outlined text-sm text-primary">schedule</span>
                                <span class="font-label-sm text-label-sm">${formattedDate}</span>
                            </div>
                            ${isVideo ? `<div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-white text-5xl">play_circle</span></div>` : ''}
                        </div>
                        <div class="p-lg flex-1 flex flex-col">
                            <div class="flex justify-between items-start mb-md">
                                <p class="font-body-md text-body-md text-on-surface line-clamp-3">
                                    "${post.caption || 'Sem legenda'}"
                                </p>
                            </div>
                            <div class="flex items-center gap-md mb-lg py-sm border-y border-outline-variant/30">
                                <span class="font-label-sm text-label-sm text-on-surface-variant italic">Aguardando aprovação do cliente</span>
                            </div>
                            <div class="flex items-center justify-between gap-md mt-auto">
                                <button class="btn-feedback flex-1 border border-outline-variant hover:bg-surface-container-high text-on-surface py-sm rounded-lg font-body-md transition-colors flex items-center justify-center gap-xs">
                                    <span class="material-symbols-outlined text-body-md">edit_note</span>
                                    Ajustar
                                </button>
                                <button class="btn-approve flex-1 bg-primary text-on-primary py-sm rounded-lg font-body-md hover:opacity-90 transition-opacity flex items-center justify-center gap-xs">
                                    <span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                                    Aprovar
                                </button>
                            </div>
                        </div>
                    `;

                    // Ação do botão Aprovar
                    card.querySelector('.btn-approve').addEventListener('click', async () => {
                        try {
                            const { error } = await supabase
                                .from('posts')
                                .update({ status: 'Aprovado' })
                                .eq('id', post.id);
                            
                            if (error) throw error;
                            
                            alert('Post aprovado com sucesso!');
                            await fetchPendingPosts();
                        } catch(err) {
                            console.error('Erro ao aprovar post:', err);
                            alert('Erro ao aprovar post: ' + err.message);
                        }
                    });

                    // Ação do botão Ajustar (Feedback)
                    card.querySelector('.btn-feedback').addEventListener('click', async () => {
                        const feedback = prompt('Deseja enviar feedbacks para ajuste? Escreva abaixo (o post voltará para rascunho):');
                        if (feedback === null) return; // Cancelou
                        
                        try {
                            if (feedback.trim() !== '') {
                                await supabase.from('post_comments').insert({
                                    post_id: post.id,
                                    user_name: 'Julia Duarte (Studio)',
                                    content: feedback.trim()
                                });
                            }

                            const { error } = await supabase
                                .from('posts')
                                .update({ status: 'Rascunho' })
                                .eq('id', post.id);
                            
                            if (error) throw error;
                            
                            alert('Feedback enviado! O post retornou para rascunho.');
                            await fetchPendingPosts();
                        } catch(err) {
                            console.error('Erro ao enviar feedback:', err);
                            alert('Erro ao processar feedback: ' + err.message);
                        }
                    });

                    approvalsGrid.appendChild(card);
                });
            }

            // Botão Aprovar Todos
            btnApproveAll.addEventListener('click', async () => {
                if (pendingPosts.length === 0) return;
                
                const confirmed = confirm(`Deseja aprovar todos os ${pendingPosts.length} posts pendentes de uma vez?`);
                if (!confirmed) return;

                try {
                    const postIds = pendingPosts.map(p => p.id);
                    const { error } = await supabase
                        .from('posts')
                        .update({ status: 'Aprovado' })
                        .in('id', postIds);

                    if (error) throw error;

                    alert('Todos os posts foram aprovados!');
                    await fetchPendingPosts();
                } catch(err) {
                    console.error('Erro ao aprovar todos os posts:', err);
                    alert('Erro ao aprovar todos os posts: ' + err.message);
                }
            });

            // Efeitos de micro-interação genéricos
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('mousedown', () => {
                    btn.style.transform = 'scale(0.96)';
                });
                btn.addEventListener('mouseup', () => {
                    btn.style.transform = 'scale(1)';
                });
                btn.addEventListener('mouseleave', () => {
                    btn.style.transform = 'scale(1)';
                });
            });

            // Inicialização
            await fetchPendingPosts();
        });
    </script>
