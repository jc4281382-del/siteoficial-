    <style>
        /* RESET E ESTILO BÁSICO */
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        /* ETIQUETA HOVER (TOOLTIP) */
        #tooltip {
            position: absolute;
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 15px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.3);
            backdrop-filter: blur(5px);
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* PAINEL LATERAL (CLICK) */
        #info-panel {
            position: absolute;
            top: 50%;
            right: -300px;
            transform: translateY(-50%);
            width: 250px;
            background: rgba(10, 15, 30, 0.85);

            padding: 20px;
            transition: right 0.5s ease-in-out;
            backdrop-filter: blur(10px);

        }

        #info-panel.active {
            right: 20px;
        }
    </style>

    <div id="info-panel">

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÃO BÁSICA
        // ==========================================
        function getDeviceZ() {
            return window.innerWidth < 768 ? 20 : 12;
        }
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = getDeviceZ();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. FUNDO DE ANTIGRAVIDADE (Cores AXION)
        // ==========================================
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorPalette = [
            new THREE.Color(0x1A237E), // Azul Profundo
            new THREE.Color(0xAA00FF), // Roxo Neon
            new THREE.Color(0x00BFFF), // Azul Claro Brilhante
            new THREE.Color(0x00FFFF)  // Ciano
        ];

        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 50;
            posArray[i + 1] = (Math.random() - 0.5) * 50;
            posArray[i + 2] = (Math.random() - 0.5) * 20;

            const mixedColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colorsArray[i] = mixedColor.r;
            colorsArray[i + 1] = mixedColor.g;
            colorsArray[i + 2] = mixedColor.b;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // ==========================================
        // 3. AS FERRAMENTAS (N8N no Centro)
        // ==========================================
        const tools = [
            { name: "n8n", color: 0xff0055, desc: "O grande maestro da automação. Orquestra todos os fluxos.", image: "image_36f762.png", isCenter: true },
            { name: "Anthropic", color: 0xffffff, desc: "IA com foco em segurança e alinhamento.", image: "Anthropic.jpg", isCenter: false },
            { name: "Antigravity", color: 0x00BFFF, desc: "Design e experiência imersiva.", image: "Antigravity.jpg", isCenter: false },
            { name: "Gemini", color: 0x4285f4, desc: "Processamento multimodal do Google.", image: "gemini.jpg", isCenter: false },
            { name: "GitHub", color: 0xffffff, desc: "Plataforma de hospedagem de código-fonte.", image: "GitHub.jpg", isCenter: false },
            { name: "MCP", color: 0xaaaaaa, desc: "Model Context Protocol.", image: "MCP.jpg", isCenter: false },
            { name: "OpenAI", color: 0x00ffff, desc: "Cérebro cognitivo de inteligência artificial.", image: "openai.jpg", isCenter: false },
            { name: "React", color: 0x61dafb, desc: "Biblioteca para construção de interfaces.", image: "react.jpg", isCenter: false }
        ];

        const nodes = [];
        const nodeGroup = new THREE.Group();
        scene.add(nodeGroup);

        let nodeGeo;
        if (typeof THREE.RoundedBoxGeometry !== 'undefined') {
            nodeGeo = new THREE.RoundedBoxGeometry(2, 2, 2, 10, 0.95);
        } else {
            nodeGeo = new THREE.BoxGeometry(2, 2, 2);
        }
        
        const textureLoader = new THREE.TextureLoader();

        const orbitingToolsCount = tools.filter(t => !t.isCenter).length;
        let orbitIndex = 0;

        tools.forEach((tool) => {
            // Material base com a cor da ferramenta (Fallback se a textura falhar ou CORS local)
            const cubeMaterial = new THREE.MeshStandardMaterial({
                color: tool.color,
                roughness: 0.3,
                metalness: 0.2
            });

            // Tentativa de carregar a textura
            textureLoader.load(
                tool.image,
                function(texture) {
                    cubeMaterial.map = texture;
                    cubeMaterial.color.setHex(0xffffff); // Remove a cor base para mostrar a textura perfeitamente
                    cubeMaterial.needsUpdate = true;
                },
                undefined,
                function(err) {
                    console.warn("Aviso: Textura " + tool.image + " não pôde ser carregada localmente (CORS ou caminho). Usando cor de fallback.");
                }
            );

            const mesh = new THREE.Mesh(nodeGeo, cubeMaterial);

            // LÓGICA DE POSICIONAMENTO: Centro vs Órbita
            if (tool.isCenter) {
                // n8n fica exatamente no centro
                mesh.position.set(0, 0, 0);
                mesh.scale.set(2.5, 2.5, 2.5);
            } else {
                // Os demais calculam seu espaço no círculo externo
                const angle = (orbitIndex / orbitingToolsCount) * Math.PI * 2;
                const radius = 8;
                mesh.position.x = Math.cos(angle) * radius;
                mesh.position.z = Math.sin(angle) * radius;
                orbitIndex++;
            }

            mesh.userData = {
                name: tool.name,
                desc: tool.desc,
                yOffset: Math.random() * Math.PI * 2,
                baseY: mesh.position.y + ((Math.random() - 0.5) * 2),
                isHovered: false,
                currentHoverOffset: 0
            };

            const light = new THREE.PointLight(tool.color, 1.5, 12);
            mesh.add(light);

            nodes.push(mesh);
            nodeGroup.add(mesh);
        });

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // ==========================================
        // 4. INTERAÇÃO (Removida)
        // ==========================================
        let globalRotationSpeed = 0.002;

        // ==========================================
        // 5. LOOP DE ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            const positions = particlesMesh.geometry.attributes.position.array;
            for (let i = 1; i < particlesCount * 3; i += 3) {
                positions[i] += 0.015;
                if (positions[i] > 25) positions[i] = -25;
            }
            particlesMesh.geometry.attributes.position.needsUpdate = true;

            particlesMesh.rotation.y += 0.0005;
            camera.lookAt(scene.position);

            nodeGroup.rotation.y += globalRotationSpeed;

            nodes.forEach((node) => {
                const baseFloat = Math.sin(elapsedTime * 2 + node.userData.yOffset) * 0.5;

                node.position.y = node.userData.baseY + baseFloat;

                node.rotation.x += 0.005;
                node.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.position.z = getDeviceZ();
        });

        animate();
    </script>

    function renderKanban() {
      if(!document.getElementById('col-frios')) return;
      document.getElementById('col-frios').innerHTML = '';
      document.getElementById('col-quente').innerHTML = '';
      document.getElementById('col-fechado').innerHTML = '';

        if(client.status === 'quente') countQuente++;
        if(client.status === 'fechado') countFechado++;

        const card = document.createElement('div');

        card.draggable = true;

    const chatContainer = document.getElementById('chat-messages-container');

    const typingIndicator = document.getElementById('chat-typing-indicator');

    function appendMessage(text, sender) {
      if (!chatContainer) return;
      const messageDiv = document.createElement('div');
      if (sender === 'user') {
        messageDiv.className = 'bg-gradient-to-r from-[#052FF0]/80 to-[#7133ED]/80 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] self-end shadow-md';
      } else {
        messageDiv.className = 'bg-[#1c1c22] text-[#e5e2e1] p-3 rounded-2xl rounded-tl-none max-w-[85%] self-start border border-white/5';
      }
      messageDiv.textContent = text;
      
      if (typingIndicator) {
        chatContainer.insertBefore(messageDiv, typingIndicator);
      } else {
        chatContainer.appendChild(messageDiv);
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      if (typingIndicator) {
        typingIndicator.classList.remove('hidden');
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function hideTypingIndicator() {
      if (typingIndicator) {
        typingIndicator.classList.add('hidden');

    // Recupera ou cria um sessionId persistente usando localStorage

      return sessId;
    }

    async function sendChatMessage(text) {
      appendMessage(text, 'user');
      showTypingIndicator();
      
      const quickReplies = document.getElementById('chat-quick-replies');
      if (quickReplies) quickReplies.style.display = 'none';

      try {
        const response = await fetch('https://webhook.agent-ia.tech/webhook/site_update_CRM', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text, sessionId: getSessionId() })
        });

        hideTypingIndicator();

        if (response.ok) {
          const contentType = response.headers.get('content-type');
          let reply = "";
          if (contentType && contentType.includes('application/json')) {
            const data = await response.json();
            reply = data.response || data.message || data.output || data;
          } else {
            reply = await response.text();
          }

          if (Array.isArray(reply)) {
            // Se for um array de mensagens (split), mostra uma por uma com delay
            for (let i = 0; i < reply.length; i++) {
              if (i > 0) {
                showTypingIndicator();
                await new Promise(r => setTimeout(r, 1000 + Math.random() * 1000)); // Delay natural
                hideTypingIndicator();
              }
              appendMessage(reply[i], 'bot');
            }
          } else {
            appendMessage(typeof reply === 'string' ? reply : JSON.stringify(reply), 'bot');
          }
        } else {
          throw new Error('Erro na resposta do webhook');
        }
      } catch (error) {
        console.error(error);
        hideTypingIndicator();
        setTimeout(() => {
          appendMessage("Olá! Sua mensagem foi integrada com sucesso ao nosso webhook de demonstração. Nosso agente de IA está processando sua solicitação e em breve entraremos em contato via WhatsApp!", 'bot');
        }, 800);
      }
    }

    function handleQuickReply(text) {
      sendChatMessage(text);
    }

    function handleChatSubmit(e) {
      e.preventDefault();
      if (!chatInput) return;
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      sendChatMessage(text);
    }

    // ==========================================
    // LÓGICA DO SMARTPHONE 3: AGENDAMENTO IA
    // ==========================================
    let selectedSlot = 1;
    function selectTimeSlot(index) {
      selectedSlot = index;
      document.querySelectorAll('.time-slot').forEach(slot => {
        slot.className = 'time-slot border border-white/10 hover:border-white/20 text-[#e5e2e1] rounded-xl py-3 text-center text-[10px] font-medium cursor-pointer transition-all';
      });
      const activeSlot = document.getElementById(`time-slot-${index}`);
      if (activeSlot) {
        activeSlot.className = 'time-slot border border-primary text-primary bg-primary/10 rounded-xl py-3 text-center text-[10px] font-bold cursor-pointer transition-all';
      }
    }

    function handleAppointmentSubmit() {
      const slotsText = {
        1: "09:00 AM",
        2: "10:30 AM",
        3: "02:00 PM",
        4: "04:15 PM"
      };
      alert(`Simulação de Agendamento: Reunião pré-marcada para quarta-feira, dia 15, às ${slotsText[selectedSlot]}!`);
    }

    // Lógica do carrossel de smartphones em mobile
    const smartphonesContainer = document.getElementById('smartphones-container');
    const smartphonesIndicators = document.getElementById('smartphones-indicators');
    if (smartphonesContainer && smartphonesIndicators) {
      smartphonesContainer.addEventListener('scroll', throttle(() => {
        const dots = smartphonesIndicators.querySelectorAll('span');
        const containerWidth = smartphonesContainer.clientWidth;
        const scrollLeft = smartphonesContainer.scrollLeft;
        const activeIndex = Math.round(scrollLeft / containerWidth);
        
        dots.forEach((dot, index) => {
          if (index === activeIndex) {
            dot.className = 'w-6 h-1 rounded-full bg-primary shadow-[0_0_6px_rgba(75,142,255,0.8)] transition-all duration-300';
          } else {
            dot.className = 'w-1.5 h-1 rounded-full bg-white/20 transition-all duration-300';
          }
        });
      }, 100));
    }
  
</script>
