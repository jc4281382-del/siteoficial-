<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXION - Arquitetura 3D Centralizada</title>
    <style>
        /* RESET E ESTILO BÁSICO */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030614;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        /* ETIQUETA HOVER (TOOLTIP) */
        #tooltip {
            position: absolute;
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 15px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.3);
            backdrop-filter: blur(5px);
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* PAINEL LATERAL (CLICK) */
        #info-panel {
            position: absolute;
            top: 50%;
            right: -300px;
            transform: translateY(-50%);
            width: 250px;
            background: rgba(10, 15, 30, 0.85);
            border-left: 2px solid #AA00FF;
            padding: 20px;
            transition: right 0.5s ease-in-out;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #info-panel.active {
            right: 20px;
        }
    </style>
</head>

<body>

    <div id="tooltip">Ferramenta</div>
    <div id="info-panel">
        <h2 id="info-title">Título</h2>
        <p id="info-desc">Descrição da tecnologia.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÃO BÁSICA
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. FUNDO DE ANTIGRAVIDADE (Cores AXION)
        // ==========================================
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorPalette = [
            new THREE.Color(0x1A237E), // Azul Profundo
            new THREE.Color(0xAA00FF), // Roxo Neon
            new THREE.Color(0x00BFFF), // Azul Claro Brilhante
            new THREE.Color(0x00FFFF)  // Ciano
        ];

        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 50;
            posArray[i + 1] = (Math.random() - 0.5) * 50;
            posArray[i + 2] = (Math.random() - 0.5) * 20;

            const mixedColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colorsArray[i] = mixedColor.r;
            colorsArray[i + 1] = mixedColor.g;
            colorsArray[i + 2] = mixedColor.b;
        }

        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // ==========================================
        // 3. AS FERRAMENTAS (N8N no Centro)
        // ==========================================
        const tools = [
            { name: "n8n", color: 0xff0055, desc: "O grande maestro da automação. Orquestra todos os fluxos.", image: "image_36f762.png", isCenter: true },
            { name: "Anthropic", color: 0xffffff, desc: "IA com foco em segurança e alinhamento.", image: "Anthropic.jpg", isCenter: false },
            { name: "Antigravity", color: 0x00BFFF, desc: "Design e experiência imersiva.", image: "Antigravity.jpg", isCenter: false },
            { name: "Gemini", color: 0x4285f4, desc: "Processamento multimodal do Google.", image: "gemini.jpg", isCenter: false },
            { name: "GitHub", color: 0xffffff, desc: "Plataforma de hospedagem de código-fonte.", image: "GitHub.jpg", isCenter: false },
            { name: "MCP", color: 0xaaaaaa, desc: "Model Context Protocol.", image: "MCP.jpg", isCenter: false },
            { name: "OpenAI", color: 0x00ffff, desc: "Cérebro cognitivo de inteligência artificial.", image: "openai.jpg", isCenter: false },
            { name: "React", color: 0x61dafb, desc: "Biblioteca para construção de interfaces.", image: "react.jpg", isCenter: false }
        ];

        const nodes = [];
        const nodeGroup = new THREE.Group();
        scene.add(nodeGroup);

        const roundedCubeGeo = new THREE.RoundedBoxGeometry(2, 2, 2, 4, 0.3);
        const textureLoader = new THREE.TextureLoader();

        const orbitingToolsCount = tools.filter(t => !t.isCenter).length;
        let orbitIndex = 0;

        tools.forEach((tool) => {
            const toolTexture = textureLoader.load(tool.image);

            const cubeMaterial = new THREE.MeshStandardMaterial({
                map: toolTexture,
                roughness: 0.3,
                metalness: 0.2
            });

            const mesh = new THREE.Mesh(roundedCubeGeo, cubeMaterial);

            // LÓGICA DE POSICIONAMENTO: Centro vs Órbita
            if (tool.isCenter) {
                // n8n fica exatamente no centro
                mesh.position.set(0, 0, 0);
                // TAMANHO AUMENTADO AQUI: Passou de 1.4 para 2.5!
                mesh.scale.set(2.5, 2.5, 2.5);
            } else {
                // Os demais calculam seu espaço no círculo externo
                const angle = (orbitIndex / orbitingToolsCount) * Math.PI * 2;
                const radius = 8;
                mesh.position.x = Math.cos(angle) * radius;
                mesh.position.z = Math.sin(angle) * radius;
                orbitIndex++;
            }

            mesh.userData = {
                name: tool.name,
                desc: tool.desc,
                yOffset: Math.random() * Math.PI * 2,
                baseY: mesh.position.y + ((Math.random() - 0.5) * 2),
                isHovered: false,
                currentHoverOffset: 0
            };

            const light = new THREE.PointLight(tool.color, 1.5, 12);
            mesh.add(light);

            nodes.push(mesh);
            nodeGroup.add(mesh);
        });

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // ==========================================
        // 4. INTERAÇÃO (Mouse, Parallax, Raycaster)
        // ==========================================
        let mouseX = 0, mouseY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let hoveredNode = null;
        let globalRotationSpeed = 0.002;

        const tooltip = document.getElementById('tooltip');
        const infoPanel = document.getElementById('info-panel');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            tooltip.style.left = event.clientX + 15 + 'px';
            tooltip.style.top = event.clientY + 15 + 'px';
        });

        // Recebe coordenadas do mouse via postMessage (enviadas pelo index.html)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'mousemove') {
                const nx = event.data.x; // normalizado 0..1
                const ny = event.data.y; // normalizado 0..1
                // Converte para espaço centralizado usado pelo Three.js parallax
                mouseX = (nx - 0.5) * window.innerWidth;
                mouseY = (ny - 0.5) * window.innerHeight;
                mouse.x = nx * 2 - 1;
                mouse.y = -(ny * 2 - 1);
            }
        });

        document.addEventListener('click', () => {
            if (hoveredNode) {
                infoTitle.innerText = hoveredNode.userData.name;
                infoDesc.innerText = hoveredNode.userData.desc;
                infoPanel.classList.add('active');
                camera.position.z = 10;
            } else {
                infoPanel.classList.remove('active');
                camera.position.z = 18;
            }
        });

        // ==========================================
        // 5. LOOP DE ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            const positions = particlesMesh.geometry.attributes.position.array;
            for (let i = 1; i < particlesCount * 3; i += 3) {
                positions[i] += 0.015;
                if (positions[i] > 25) positions[i] = -25;
            }
            particlesMesh.geometry.attributes.position.needsUpdate = true;

            particlesMesh.rotation.y += 0.0005;
            camera.position.x += (mouseX * 0.005 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.005 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                if (hoveredNode !== intersects[0].object) {
                    if (hoveredNode) hoveredNode.userData.isHovered = false;

                    hoveredNode = intersects[0].object;
                    hoveredNode.userData.isHovered = true;

                    globalRotationSpeed = 0.0002;
                    tooltip.innerHTML = hoveredNode.userData.name;
                    tooltip.style.opacity = 1;
                }
            } else {
                if (hoveredNode) {
                    hoveredNode.userData.isHovered = false;
                    hoveredNode = null;
                    globalRotationSpeed = 0.002;
                    tooltip.style.opacity = 0;
                }
            }

            nodeGroup.rotation.y += globalRotationSpeed;

            nodes.forEach((node) => {
                const baseFloat = Math.sin(elapsedTime * 2 + node.userData.yOffset) * 0.5;
                const targetJump = node.userData.isHovered ? 1.5 : 0;

                node.userData.currentHoverOffset = THREE.MathUtils.lerp(node.userData.currentHoverOffset, targetJump, 0.1);
                node.position.y = node.userData.baseY + baseFloat + node.userData.currentHoverOffset;

                node.rotation.x += 0.005;
                node.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
